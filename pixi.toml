[workspace]
authors = ["lwantoch <l.wantoch@icloud.com>"]
channels = ["conda-forge", "https://salilab.org/modeller/conda/"]
name = "stack-protein_preparation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
pipeline = "python scripts/run_pipeline.py"
tests = "pytest"

[dependencies]
python = "3.12.*"
openmm = ">=8.4.0,<9"
mafft = "*"
pillow = ">=12.1.1,<13"
pdb2pqr = "*"
propka = "*"
matplotlib = ">=3.10.8,<4"
pytest = "*"
biopython = ">=1.87,<2"
gromacs = ">=2026.0,<2027"
modeller = "*"
ambertools = "*"
pip = ">=26.1.1,<27"
pdbfixer = ">=1.12,<2"

[pypi-dependencies]
openpyxl = ">=3.1.5,<4"
et_xmlfile = ">=2.0.0,<3"
biopython = ">=1.86,<2"
reportlab = ">=4.0,<5"

[activation.env]
CHIMERA_EXECUTABLE = "/home/grheco/.local/bin/chimera"
# Modeller license key — obtain from https://salilab.org/modeller/registration.html
# Set in your shell before running: export KEY_MODELLER=your_key
KEY_MODELLER = "${KEY_MODELLER}"

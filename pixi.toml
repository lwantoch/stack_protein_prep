[workspace]
authors = ["lwantoch <l.wantoch@icloud.com>"]
channels = ["conda-forge", "salilab"]
name = "stack-protein_preparation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
pipeline = "python scripts/run_pipeline.py"
tests = "pytest"

[dependencies]
# Heavy compiled tools (GROMACS, AmberTools, MAFFT) are loaded via CESGA modules.
# See scripts/CESGA_SLURM/ and the fruton wrapper for module load commands.
python = "3.11.*"
openmm = ">=8.4.0,<9"
pillow = ">=12.1.1,<13"
pdb2pqr = "*"
propka = "*"
matplotlib = ">=3.10.8,<4"
pytest = "*"
biopython = ">=1.87,<2"
modeller = "*"
pip = "*"
pymol-open-source = "*"
rdkit = "*"
# Meeko is used by _meeko_gate.py to validate that FRUTON's protonation
# output is actually consumable by the downstream AutoDock receptor prep.
# Without this, we would only discover receptor failures much later during
# docking. Meeko lives on conda-forge; 0.7+ has the Polymer.from_pdb_string
# API used by the gate.
meeko = ">=0.7,<0.8"
nbformat = ">=5.11.1,<6"
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
openpyxl = ">=3.1.5,<4"
et_xmlfile = ">=2.0.0,<3"
biopython = ">=1.86,<2"
reportlab = ">=4.0,<5"

[activation.env]
CHIMERA_EXECUTABLE = "/home/grheco/.local/bin/chimera"
# Modeller license key — obtain from https://salilab.org/modeller/registration.html
# Set in your shell before running: export KEY_MODELLER=your_key
KEY_MODELLER = "${KEY_MODELLER}"
